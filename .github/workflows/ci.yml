name: Check site

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish main to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          test -n "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          curl --fail --silent --show-error --max-time 30 --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK" --output "$RUNNER_TEMP/pages-deploy.json"
          node -e "const r = require(process.env.RUNNER_TEMP + '/pages-deploy.json'); if (!r.success) throw new Error('Cloudflare rejected the deployment'); console.log('Cloudflare Pages build requested.');"
